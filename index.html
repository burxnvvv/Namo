<!DOCTYPE html>
<html lang="ru" data-theme="autumn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--bg:#07070d;--fg:#f2f2fa;--mut:#9a9ab4;--card:#ffffff14;--glass:#ffffff14;--acc:#b7a8ff;--acc2:#ff6b9d;--on:#fff;--p1:#7c6bff;--p2:#ff5c93;--g1:#3b2fb0aa;--g2:#ff5c9340;--g3:#1b1560;box-sizing:border-box;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;min-height:-webkit-fill-available;margin:0}
html{background:var(--bg)}
body::before{content:"";position:fixed;left:0;right:0;top:-150px;bottom:-250px;z-index:-1;pointer-events:none;background:radial-gradient(60% 40% at 12% 8%,var(--g1) 0,transparent 70%),radial-gradient(45% 35% at 95% 30%,var(--g2) 0,transparent 70%),radial-gradient(70% 50% at 25% 100%,var(--g3) 0,transparent 70%),var(--bg)}
body{color:var(--fg);font:16px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;overflow:hidden}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.f{fill:currentColor}
button,label{font:inherit;color:inherit}
#main{position:fixed;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 190px;max-width:760px;margin:0 auto}
.hd{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}
h1{font-size:34px;letter-spacing:-.5px;margin:0}
.rb{width:40px;height:40px;border-radius:50%;background:var(--card);border:0;display:grid;place-items:center;cursor:pointer}
.acts{display:flex;gap:10px;margin:0 0 14px}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px;background:var(--card);color:var(--acc);font-weight:600;cursor:pointer}
.pill.p{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.row{display:flex;align-items:center;gap:12px;padding:8px 0}
.cov{border-radius:10px;flex:none;display:grid;place-items:center;color:#ffffffd9;font-weight:800;box-shadow:0 4px 14px #0003}
.row .cov{width:54px;height:54px;font-size:22px}
.inf{flex:1;min-width:0;cursor:pointer}
.t,.a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{color:var(--mut);font-size:14px;margin-top:2px}
.row.cur .t{color:var(--acc)}
.ib{background:none;border:0;color:var(--mut);padding:8px;cursor:pointer;display:grid;place-items:center}
.ib.on{color:var(--acc)}
.sr{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:0 12px;margin-bottom:10px;color:var(--mut)}
.sr input{flex:1;background:none;border:0;outline:0;color:var(--fg);font:inherit;padding:12px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.pc{cursor:pointer}.pc .cov{width:100%;aspect-ratio:1;font-size:40px;border-radius:16px}
.pc .t{margin-top:8px;font-weight:600}
.empty{text-align:center;color:var(--mut);padding:50px 20px}
.empty .i{width:48px;height:48px;opacity:.5;margin-bottom:10px}
#mini{position:fixed;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom,0px));max-width:740px;margin:0 auto;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:16px;padding:8px 10px;display:none;align-items:center;gap:10px;box-shadow:0 6px 24px #0003;overflow:hidden}
#mini .cov{width:44px;height:44px;font-size:18px}
#mpb{position:absolute;left:0;bottom:0;height:2px;background:var(--acc);width:0}
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}

#nav button.on{color:var(--acc)}
#full{position:fixed;inset:0;z-index:20;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 26px calc(env(safe-area-inset-bottom,0px) + 24px);background:var(--bg);overflow:hidden}
#full.open{transform:none}
#fbg{position:absolute;inset:-20%;filter:blur(70px);opacity:.55;z-index:-1;transition:background .5s}
#full .top{width:100%;max-width:420px;display:flex;justify-content:space-between}
#fcov{width:min(80vw,380px,42vh);aspect-ratio:1;margin:auto 0 18px;border-radius:22px;font-size:90px;transform:scale(.86);transition:transform .45s cubic-bezier(.2,.8,.2,1);box-shadow:0 24px 60px #0005}
#fcov.pl{transform:scale(1)}
.fi{width:100%;max-width:420px}
.fi .tt{display:flex;align-items:center;gap:10px}
#ft{font-size:22px;font-weight:700}#fa{color:var(--mut);margin-top:3px;font-size:17px}
input[type=range]{width:100%;accent-color:var(--acc);margin:16px 0 0}
.tm{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.ctl{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px}
.ctl .ib{color:var(--fg)}.ctl .ib.on{color:var(--acc)}
.ctl .big .i{width:34px;height:34px}
#bp{width:72px;height:72px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;border:0;cursor:pointer}
#bp .i{width:30px;height:30px}
#ov{position:fixed;inset:0;background:#0007;z-index:30;display:none;align-items:flex-end;justify-content:center}
#sh{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:80vh;overflow-y:auto}
#sh h3{margin:0 0 12px}
.op{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:13px 4px;text-align:left;cursor:pointer;border-bottom:1px solid var(--card)}
.op.d{color:var(--acc)}
textarea{width:100%;min-height:110px;background:var(--card);color:var(--fg);border:0;border-radius:12px;padding:12px;font:inherit;margin:8px 0}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);background:#000d;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;display:none;z-index:50;max-width:90vw;text-align:center}
#mini,#nav,.rb,.pill,.sr,#sh,textarea{background:linear-gradient(135deg,#ffffff2b,#ffffff0d);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid #ffffff30;box-shadow:inset 0 1px 0 #ffffff66,inset 0 -1px 0 #ffffff14,0 10px 30px #0006}
.pill.p{background:linear-gradient(135deg,var(--p1),var(--p2));color:var(--on);border-color:#ffffff55}
#nav{left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);border-radius:30px;padding:7px 6px;max-width:500px;margin:0 auto}
#nav button{padding:7px 14px;border-radius:22px;min-width:0;flex:1}
#nav button.on{background:#ffffff26;box-shadow:inset 0 1px 0 #ffffff55}
#mini{bottom:calc(env(safe-area-inset-bottom,0px) + 84px);border-radius:22px}
#sh{border-radius:28px 28px 0 0;border-bottom:0}
.rb{border-radius:50%}.sr{border-radius:16px}textarea{border-radius:16px}
#full{background:radial-gradient(70% 45% at 20% 0,var(--g1),transparent 70%),radial-gradient(50% 35% at 100% 60%,var(--g2),transparent 70%),var(--bg)}
#bp{box-shadow:0 8px 24px #0006,inset 0 1px 0 #fff9;background:linear-gradient(135deg,var(--p1),var(--p2));color:var(--on)}
:root[data-theme="autumn"]{--bg:#231815;--fg:#f7eadf;--mut:#b9a193;--acc:#f3c3a0;--acc2:#e8a5a0;--on:#2b1a16;--p1:#f6cdb0;--p2:#e8a0a4;--g1:#e0997a66;--g2:#e8a5a055;--g3:#9fb59055}
@keyframes fd{from{opacity:0}}.fade{animation:fd .6s ease}
.ex{display:flex;justify-content:space-around;margin-top:4px}.ex .ib{color:var(--mut);font-weight:700;min-width:48px;font-size:15px}.ex .ib.on{color:var(--acc)}
.rec{display:flex;gap:12px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}.rc{width:104px;flex:none;cursor:pointer}.rc .cov{width:104px;height:104px;font-size:34px;border-radius:18px}.rc .t{font-size:13px;margin-top:6px}
.inp{width:100%;background:#ffffff14;color:var(--fg);border:1px solid #ffffff30;border-radius:14px;padding:13px 14px;font:inherit;outline:0}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;letter-spacing:1px;margin-bottom:4px}
.brand svg{width:40px;height:40px;flex:none}
.stp{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff1a;line-height:1.4}
.stp b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--on);display:grid;place-items:center;font-size:14px}
:root{--sab:env(safe-area-inset-bottom,0px)}
#nav{left:0;right:0;bottom:0;max-width:none;margin:0;border-radius:0;border:0;border-top:1px solid #ffffff1f;box-shadow:none;padding:8px 10px calc(8px + var(--sab));background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,#fff 5%)}
#nav button{flex:1}
#mini{bottom:calc(var(--sab) + 80px)}
#full{padding-bottom:calc(var(--sab) + 24px)}
#sh{padding-bottom:calc(var(--sab) + 18px)}
</style></head><body>

</defs></svg>
<div id="main"></div>
<div id="mini" onclick="openFull()"><div class="cov" id="mc"></div><div class="inf" style="cursor:pointer"><div class="t" id="mt"></div><div class="a" id="ma"></div></div>
<button class="ib" style="color:var(--fg)" onclick="event.stopPropagation();toggle()" id="mp"></button>
<button class="ib" style="color:var(--fg)" onclick="event.stopPropagation();step(1)"></button><div id="mpb"></div></div>
<div id="nav"></div>
<div id="full"><div id="fbg"></div>
<div class="top"><button class="ib" onclick="closeFull()" id="fdown"></button><span></span></div>
<div class="cov" id="fcov"></div>
<div class="fi"><div class="tt"><div style="flex:1;min-width:0"><div class="t" id="ft">—</div><div class="t" id="fa"></div></div><button class="ib" id="ffav" onclick="favCur()"></button></div>
<input type="range" id="sk" min="0" max="1000" value="0"><div class="tm"><span id="ct">0:00</span><span id="dt">0:00</span></div>
<div class="ctl"><button class="ib" id="bs" onclick="tgS()"></button><button class="ib big" onclick="step(-1)" id="bpv"></button><button id="bp" onclick="toggle()"></button><button class="ib big" onclick="step(1)" id="bnx"></button><button class="ib" id="br" onclick="tgR()"></button></div><div class="ex"><button class="ib" id="bspd" onclick="speedSheet()"></button><button class="ib" id="bslp" onclick="sleepSheet()"></button><button class="ib" id="bq" onclick="queueSheet()"></button></div></div></div>
<div id="ov" onclick="if(event.target===this)closeSh()"><div id="sh"></div></div>
<div id="toast"></div><audio id="au"></audio>
<script>
var au=document.getElementById('au');
var LOGO='<svg viewBox="0 0 64 64"><defs><linearGradient id="lgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--p1)"/><stop offset="1" style="stop-color:var(--p2)"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#lgg)"/><rect x=".5" y=".5" width="63" height="63" rx="17.5" fill="none" stroke="#ffffff55"/><path d="M13 38q6-16 12 0t12 0 12 0" fill="none" style="stroke:var(--on)" stroke-width="4.5" stroke-linecap="round"/><circle cx="46" cy="19" r="4.5" style="fill:var(--on)"/></svg>';
var S={tracks:[],pls:[],fav:[],recent:[],theme:'autumn',sort:'old',spd:1,sleep:0,view:'lib',q:'',queue:[],ci:-1,shuf:false,rep:0,url:null,db:null};
function $(i){return document.getElementById(i)}
function ic(n,c){return '<svg class="i '+(c||'')+'"><use href="#i-'+n+'"/></svg>'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},2300)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function save(){try{localStorage.setItem('mm',JSON.stringify({tracks:S.tracks,pls:S.pls,fav:S.fav,recent:S.recent}))}catch(e){}}
function loadMeta(){try{var d=JSON.parse(localStorage.getItem('mm')||'null');if(d){S.tracks=d.tracks||[];S.pls=d.pls||[];S.fav=d.fav||[];S.recent=d.recent||[]}}catch(e){}}
function openDB(){return new Promise(function(r){try{var q=indexedDB.open('mmfiles',1);q.onupgradeneeded=function(){q.result.createObjectStore('f')};q.onsuccess=function(){S.db=q.result;r()};q.onerror=function(){r()}}catch(e){r()}})}
function putBlob(id,b){return new Promise(function(r){if(!S.db)return r(false);try{var t=S.db.transaction('f','readwrite');t.objectStore('f').put(b,id);t.oncomplete=function(){r(true)};t.onerror=function(){r(false)}}catch(e){r(false)}})}
function getBlob(id){return new Promise(function(r){if(!S.db)return r(null);try{var q=S.db.transaction('f').objectStore('f').get(id);q.onsuccess=function(){r(q.result||null)};q.onerror=function(){r(null)}}catch(e){r(null)}})}
function delBlob(id){try{S.db.transaction('f','readwrite').objectStore('f').delete(id)}catch(e){}}
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
var THEMES={mid:{n:'Midnight',d:'Глубокая ночь, фиолетовый и розовый',bg:'#07070d',sw:['#07070d','#7c6bff','#ff5c93'],pal:[['#6a5bff','#2a1e7a'],['#ff5c93','#7a1e4a'],['#3b82f6','#14306e'],['#a855f7','#4a1d7a'],['#f97362','#7a2a2a'],['#22b8cf','#0e4a5a']]},autumn:{n:'Autumn',d:'Тёплый шоколад, персик и пыльная роза',bg:'#231815',sw:['#231815','#f3c3a0','#e8a5a0'],pal:[['#d98b6a','#8f4a35'],['#d9969a','#8a4a56'],['#dcae6a','#8f6a2e'],['#9db08a','#5a7050'],['#b98aa0','#6e4560'],['#eaa27e','#a85d3a']]}};
var PAL=THEMES.autumn.pal;
function grad(s){var p=PAL[hue(s)%6];return 'linear-gradient(135deg,'+p[0]+','+p[1]+')'}
function cv(t){return '<div class="cov" style="background:'+grad(t.title+t.artist)+'">'+esc((t.title[0]||'♪').toUpperCase())+'</div>'}
function fmt(s){if(!isFinite(s))return '0:00';var m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+(x<10?'0':'')+x}
function byId(id){return S.tracks.find(function(t){return t.id===id})}
function parse(l){var p=l.split(/\s[-–—]\s/);return p.length>1?{artist:p[0].trim(),title:p.slice(1).join(' - ').trim()}:{artist:'Неизвестный исполнитель',title:l.trim()}}
/* ---- add ---- */
function addSheet(){sh('<h3>Добавить музыку</h3><div class="a">Названия по одному в строке: Исполнитель - Название</div><textarea id="bulk" placeholder="The Weeknd - Blinding Lights"></textarea><div class="acts"><button class="pill p" onclick="addBulk()">'+ic('plus')+'Добавить</button><label class="pill">'+ic('up')+'Загрузить mp3<input type="file" id="files" multiple hidden onchange="upl(this)"></label></div>')}
function addBulk(){var v=$('bulk').value.split('\n').map(function(x){return x.trim()}).filter(Boolean);if(!v.length)return;v.forEach(function(l){var p=parse(l);S.tracks.push({id:uid(),title:p.title,artist:p.artist,has:false})});save();closeSh();render();toast('Добавлено: '+v.length+'. Прикрепите mp3 через меню трека')}
async function upl(inp){var fs=Array.from(inp.files);closeSh();for(var f of fs){if(!/\.(mp3|m4a|aac|wav|flac|ogg|opus|wma|mp4|webm)$/i.test(f.name)&&f.type.indexOf('audio')!==0){toast('Пропущен файл: '+f.name);continue}var p=parse(f.name.replace(/\.[^.]+$/,'').replace(/_/g,' '));var t={id:uid(),title:p.title,artist:p.artist,has:false};var ok=await putBlob(t.id,f);t.has=true;if(!ok)t.blob=URL.createObjectURL(f);S.tracks.push(t)}save();render();toast('Загружено: '+fs.length)}
async function attach(id,f){if(!f)return;closeSh();var t=byId(id);var ok=await putBlob(id,f);t.has=true;if(!ok){t.blob=URL.createObjectURL(f);toast('Файл не сохранится после закрытия страницы')}else toast('Файл прикреплён');save();render()}
function helpSheet(){sh('<h3>Как добавить музыку</h3><div class="stp"><b>1</b><div>Скачайте mp3 на телефон или компьютер. Используйте музыку, на которую у вас есть права.</div></div><div class="stp"><b>2</b><div>В Библиотеке нажмите <b style="display:inline;background:none;color:var(--acc);width:auto">＋</b> и выберите «Загрузить mp3». Можно сразу несколько файлов.</div></div><div class="stp"><b>3</b><div>Назовите файлы так: <i>Исполнитель - Название.mp3</i>, тогда данные заполнятся сами.</div></div><div class="stp"><b>4</b><div>Или добавьте только названия списком, а файл прикрепите позже: ⋯ у трека, затем «Прикрепить mp3».</div></div><div class="a" style="margin-top:12px">Файлы хранятся на этом устройстве, в браузере. Если очистить данные браузера, их придётся загрузить заново.</div><div class="acts" style="margin-top:14px"><button class="pill p" onclick="addSheet()">'+ic('plus')+'Добавить сейчас</button></div>')}
/* ---- sheets ---- */
function sh(h){$('sh').innerHTML=h;$('ov').style.display='flex'}
function closeSh(){$('ov').style.display='none'}
function trackSheet(id){var t=byId(id),inPl=S.view.charAt(0)==='p'&&S.view.length>1||S.view==='fav';
var h='<h3>'+esc(t.title)+'</h3><div class="a" style="margin:-8px 0 8px">'+esc(t.artist)+'</div>';
h+='<button class="op" onclick="qAdd(\''+id+'\',true)">'+ic('next')+'Играть следующим</button><button class="op" onclick="qAdd(\''+id+'\',false)">'+ic('plus')+'В очередь</button>';
h+='<button class="op" onclick="plSheet(\''+id+'\')">'+ic('list')+'Добавить в плейлист</button>';
h+='<label class="op">'+ic('up')+(t.has?'Заменить mp3':'Прикрепить mp3')+'<input type="file" hidden onchange="attach(\''+id+'\',this.files[0])"></label>';
if(inPl)h+='<button class="op" onclick="fromPl(\''+id+'\')">'+ic('minus')+'Убрать из плейлиста</button>';
h+='<button class="op d" onclick="del(\''+id+'\')">'+ic('trash')+'Удалить трек</button>';sh(h)}
function plSheet(id){var h='<h3>В плейлист</h3>';S.pls.forEach(function(p){h+='<button class="op" onclick="toPl(\''+id+'\',\''+p.id+'\')">'+ic('music')+esc(p.name)+'</button>'});h+='<button class="op" onclick="newPl(\''+id+'\')">'+ic('plus')+'Новый плейлист</button>';sh(h)}
function newPl(id){sh('<h3>Новый плейлист</h3><input id="pln" class="inp" placeholder="Название" maxlength="40"><div class="acts" style="margin-top:12px"><button class="pill p" onclick="mkPl(\''+(id||'')+'\')">Создать</button></div>');setTimeout(function(){var e=$('pln');if(e)e.focus()},60)}
function mkPl(id){var n=($('pln').value||'').trim();if(!n){toast('Введите название');return}var p={id:'p'+uid(),name:n,ids:[]};if(id)p.ids.push(id);S.pls.push(p);save();closeSh();render();toast('Плейлист создан')}
function toPl(id,pid){var p=S.pls.find(function(x){return x.id===pid});if(p.ids.indexOf(id)<0)p.ids.push(id);save();closeSh();toast('Добавлено в «'+p.name+'»');render()}
function fromPl(id){if(S.view==='fav'){S.fav=S.fav.filter(function(x){return x!==id})}else{var p=S.pls.find(function(x){return x.id===S.view});p.ids=p.ids.filter(function(x){return x!==id})}save();closeSh();render()}
function del(id){sh('<h3>Удалить трек?</h3><div class="acts"><button class="pill" onclick="closeSh()">Отмена</button><button class="pill p" onclick="doDel(\''+id+'\')">Удалить</button></div>')}
function doDel(id){S.tracks=S.tracks.filter(function(t){return t.id!==id});S.fav=S.fav.filter(function(x){return x!==id});S.pls.forEach(function(p){p.ids=p.ids.filter(function(x){return x!==id})});delBlob(id);save();closeSh();render()}
function delPl(){var p=S.pls.find(function(x){return x.id===S.view});if(!p)return;sh('<h3>Удалить плейлист «'+esc(p.name)+'»?</h3><div class="acts"><button class="pill" onclick="closeSh()">Отмена</button><button class="pill p" onclick="doDelPl()">Удалить</button></div>')}
function doDelPl(){S.pls=S.pls.filter(function(x){return x.id!==S.view});S.view='pls';save();closeSh();render()}
function fav(id){var i=S.fav.indexOf(id);if(i>=0)S.fav.splice(i,1);else S.fav.push(id);save();render();updFav()}
function favCur(){var id=S.queue[S.ci];if(id)fav(id)}
/* ---- views ---- */
function setV(v){S.view=v;S.q='';render();$('main').scrollTop=0}
function rows(a){if(!a.length)return '<div class="empty">'+ic('music')+'<div>Здесь пока пусто. Нажмите ＋</div></div>';var cu=S.queue[S.ci];
return a.map(function(t){var f=S.fav.indexOf(t.id)>=0;return '<div class="row '+(cu===t.id?'cur':'')+'">'+cv(t)+'<div class="inf" onclick="playFrom(\''+t.id+'\')"><div class="t">'+esc(t.title)+'</div><div class="a">'+esc(t.artist)+(t.has?'':' · нет файла')+'</div></div><button class="ib '+(f?'on':'')+'" onclick="fav(\''+t.id+'\')">'+ic('heart',f?'f':'')+'</button><button class="ib" onclick="trackSheet(\''+t.id+'\')">'+ic('more')+'</button></div>'}).join('')}
function acts(a){return a.length?'<div class="acts"><button class="pill p" onclick="playAll(false)">'+ic('play','f')+'Играть</button><button class="pill" onclick="playAll(true)">'+ic('shuf')+'Перемешать</button></div>':''}
function cur(){var a;if(S.view==='lib'||S.view==='search')a=sorted(S.tracks);else if(S.view==='fav')a=S.fav.map(byId).filter(Boolean);else{var p=S.pls.find(function(x){return x.id===S.view});a=p?p.ids.map(byId).filter(Boolean):[]}var q=S.q.toLowerCase();return a.filter(function(t){return !q||(t.title+' '+t.artist).toLowerCase().indexOf(q)>=0})}
function render(){var v=S.view,h='',nv=v.charAt(0)==='p'&&v!=='pls'?'pls':v==='fav'?'pls':v;
if(v==='lib'){var a=cur();var rc=S.recent.map(byId).filter(Boolean);var rh=rc.length?'<div class="a" style="margin:0 0 8px">Недавно</div><div class="rec">'+rc.map(function(t){return '<div class="rc" onclick="playFrom(\''+t.id+'\')">'+cv(t)+'<div class="t">'+esc(t.title)+'</div></div>'}).join('')+'</div>':'';h='<div class="brand">'+LOGO+'<span>NAVO</span></div><div class="hd"><h1>Библиотека</h1><div style="display:flex;gap:8px;flex:none"><button class="rb" onclick="themeSheet()">'+ic('palette')+'</button><button class="rb" onclick="sortSheet()">'+ic('sort')+'</button><button class="rb" onclick="addSheet()">'+ic('plus')+'</button></div></div>'+rh+acts(a)+rows(a)}
else if(v==='search'){var a=cur();h='<div class="hd"><h1>Поиск</h1></div><div class="sr">'+ic('search')+'<input id="qi" type="search" placeholder="Треки и исполнители" value="'+esc(S.q)+'" oninput="S.q=this.value;$(\'rs\').innerHTML=rows(cur())"></div><div id="rs">'+rows(a)+'</div>'}
else if(v==='pls'){h='<div class="hd"><h1>Плейлисты</h1><button class="rb" onclick="newPl()">'+ic('plus')+'</button></div><div class="grid"><div class="pc" onclick="setV(\'fav\')"><div class="cov" style="background:linear-gradient(135deg,var(--p2),var(--p1))">'+ic('heart','f')+'</div><div class="t">Любимое</div><div class="a">'+S.fav.length+' треков</div></div>'+S.pls.map(function(p){return '<div class="pc" onclick="setV(\''+p.id+'\')"><div class="cov" style="background:'+grad(p.name)+'">'+esc(p.name[0].toUpperCase())+'</div><div class="t">'+esc(p.name)+'</div><div class="a">'+p.ids.length+' треков</div></div>'}).join('')+'</div>'}
else{var a=cur(),p=S.pls.find(function(x){return x.id===v}),name=v==='fav'?'Любимое':(p?p.name:'');h='<div class="hd"><button class="rb" onclick="setV(\'pls\')">'+ic('back')+'</button><h1 style="font-size:26px;flex:1;margin-left:12px">'+esc(name)+'</h1>'+(p?'<button class="rb" onclick="delPl()">'+ic('trash')+'</button>':'')+'</div>'+acts(a)+rows(a)}
$('main').innerHTML=h;
$('nav').innerHTML=[['lib','music','Библиотека'],['search','search','Поиск'],['pls','list','Плейлисты']].map(function(x){return '<button class="'+(nv===x[0]?'on':'')+'" onclick="setV(\''+x[0]+'\')">'+ic(x[1])+x[2]+'</button>'}).join('')}
function sorted(a){a=a.slice();if(S.sort==='new')a.reverse();else if(S.sort==='title')a.sort(function(x,y){return x.title.localeCompare(y.title)});else if(S.sort==='artist')a.sort(function(x,y){return x.artist.localeCompare(y.artist)});return a}
function sortSheet(){var o=[['old','Сначала старые'],['new','Сначала новые'],['title','По названию'],['artist','По исполнителю']];sh('<h3>Сортировка</h3>'+o.map(function(x){return '<button class="op" onclick="S.sort=\''+x[0]+'\';closeSh();render()">'+(S.sort===x[0]?'✓ ':'')+x[1]+'</button>'}).join(''))}
function setSpd(v){S.spd=v;au.defaultPlaybackRate=v;au.playbackRate=v;$('bspd').textContent=v+'×';closeSh()}
function speedSheet(){sh('<h3>Скорость</h3>'+[0.75,1,1.25,1.5,2].map(function(v){return '<button class="op" onclick="setSpd('+v+')">'+(S.spd===v?'✓ ':'')+v+'×</button>'}).join(''))}
function updSleep(){$('bslp').className='ib'+(S.sleep?' on':'')}
function setSleep(m){clearTimeout(S.st);S.sleepEnd=false;S.sleep=m;if(m>0)S.st=setTimeout(function(){au.pause();S.sleep=0;updSleep();toast('Таймер сна: музыка остановлена')},m*60000);else if(m===-1)S.sleepEnd=true;closeSh();updSleep();toast(m===0?'Таймер выключен':m===-1?'Остановится после трека':'Таймер сна: '+m+' мин')}
function sleepSheet(){sh('<h3>Таймер сна</h3>'+[[15,'15 минут'],[30,'30 минут'],[45,'45 минут'],[60,'1 час'],[-1,'После этого трека'],[0,'Выключить']].map(function(x){return '<button class="op" onclick="setSleep('+x[0]+')">'+x[1]+'</button>'}).join(''))}
function queueSheet(){var h='<h3>Далее</h3>',n=S.queue.slice(S.ci+1);if(S.ci<0||!n.length)h+='<div class="a">Очередь пуста. Добавляйте треки через меню ⋯</div>';n.forEach(function(id,i){var t=byId(id);if(!t)return;h+='<button class="op" onclick="S.ci='+(S.ci+1+i)+';closeSh();playCur()"><div class="inf"><div class="t">'+esc(t.title)+'</div><div class="a">'+esc(t.artist)+'</div></div></button>'});sh(h)}
function qAdd(id,next){closeSh();if(S.ci<0){playFrom(id);return}if(next)S.queue.splice(S.ci+1,0,id);else S.queue.push(id);toast(next?'Сыграет следующим':'Добавлено в очередь')}
var AC=null,GN=null;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();var s=AC.createMediaElementSource(au);GN=AC.createGain();s.connect(GN);GN.connect(AC.destination)}catch(e){AC=null;GN=null}}
function setGain(v,t){if(GN){var n=AC.currentTime;GN.gain.cancelScheduledValues(n);GN.gain.setValueAtTime(GN.gain.value,n);GN.gain.linearRampToValueAtTime(v,n+t)}else{try{au.volume=v}catch(e){}}}
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
function anim(){['ft','fa','mt','ma','fcov','mc'].forEach(function(i){var e=$(i);e.classList.remove('fade');void e.offsetWidth;e.classList.add('fade')})}
function setTheme(t,q){if(!THEMES[t])return;S.theme=t;PAL=THEMES[t].pal;document.documentElement.setAttribute('data-theme',t);var mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=THEMES[t].bg;try{localStorage.setItem('mt',t)}catch(e){}if(q)return;closeSh();render();var c=byId(S.queue[S.ci]);if(c){var g=grad(c.title+c.artist);$('mc').style.background=g;$('fcov').style.background=g;$('fbg').style.background=g}}
function loadTheme(){try{var t=localStorage.getItem('mt');if(t)setTheme(t,true)}catch(e){}}
function themeSheet(){sh('<h3>Тема</h3>'+Object.keys(THEMES).map(function(k){var T=THEMES[k];return '<button class="op" onclick="setTheme(\''+k+'\')"><span style="display:flex;border-radius:10px;overflow:hidden;width:56px;height:36px;flex:none;border:1px solid #ffffff40">'+T.sw.map(function(c){return '<i style="flex:1;background:'+c+'"></i>'}).join('')+'</span><div class="inf"><div class="t">'+(S.theme===k?'✓ ':'')+T.n+'</div><div class="a">'+T.d+'</div></div></button>'}).join(''))}
/* ---- player ---- */
function playAll(sh){var a=cur();if(!a.length)return;S.shuf=sh;syncBtns();var id=a[Math.floor(Math.random()*a.length)].id;if(!sh)id=a[0].id;playFrom(id)}
function playFrom(id){S.queue=cur().map(function(t){return t.id});if(S.shuf){S.queue.sort(function(){return Math.random()-.5});S.queue=[id].concat(S.queue.filter(function(x){return x!==id}))}S.ci=S.queue.indexOf(id);playCur()}
async function playCur(){var t=byId(S.queue[S.ci]);if(!t)return;if(!t.has){toast('К треку не прикреплён mp3 (меню ⋯)');return}
initAudio();if(AC&&AC.state==='suspended')AC.resume();var tk=S.tk=(S.tk||0)+1;if(!au.paused&&au.src){setGain(0,.3);await wait(330);if(tk!==S.tk)return}var src=t.blob;if(!src){var b=await getBlob(t.id);if(!b){t.has=false;save();toast('Файл не найден, прикрепите заново');render();return}if(S.url)URL.revokeObjectURL(S.url);S.url=URL.createObjectURL(b);src=S.url}
au.src=src;setGain(0,0);try{await au.play()}catch(e){}setGain(1,.9);
$('mini').style.display='flex';S.recent=[t.id].concat(S.recent.filter(function(x){return x!==t.id})).slice(0,10);save();var g=grad(t.title+t.artist),l=(t.title[0]||'♪').toUpperCase();
$('mc').style.background=g;$('mc').textContent=l;$('fcov').style.background=g;$('fcov').textContent=l;$('fbg').style.background=g;
$('mt').textContent=$('ft').textContent=t.title;$('ma').textContent=$('fa').textContent=t.artist;anim();updFav();render();
if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist});navigator.mediaSession.setActionHandler('nexttrack',function(){step(1)});navigator.mediaSession.setActionHandler('previoustrack',function(){step(-1)})}catch(e){}}}
async function toggle(){if(!au.src)return;if(AC&&AC.state==='suspended')AC.resume();if(au.paused){setGain(0,0);try{await au.play()}catch(e){}setGain(1,.35)}else{setGain(0,.25);await wait(270);au.pause()}}
function step(d){if(!S.queue.length)return;if(d<0&&au.currentTime>3){au.currentTime=0;return}var n=S.ci+d;if(n>=S.queue.length){if(S.rep===1)n=0;else return}if(n<0)n=0;S.ci=n;playCur()}
function tgS(){S.shuf=!S.shuf;syncBtns();toast(S.shuf?'Перемешивание включено':'Перемешивание выключено')}
function tgR(){S.rep=(S.rep+1)%3;syncBtns();toast(['Повтор выключен','Повтор всех','Повтор трека'][S.rep])}
function syncBtns(){$('bs').classList.toggle('on',S.shuf);$('br').classList.toggle('on',S.rep>0);$('br').innerHTML=ic('rep')+(S.rep===2?'<b style="font-size:10px;position:absolute;margin:-2px 0 0 -14px">1</b>':'')}
function updFav(){var id=S.queue[S.ci],f=S.fav.indexOf(id)>=0;$('ffav').className='ib'+(f?' on':'');$('ffav').innerHTML=ic('heart',f?'f':'')}
function openFull(){$('full').classList.add('open')}function closeFull(){$('full').classList.remove('open')}
function pstate(){var p=!au.paused;$('bp').innerHTML=ic(p?'pause':'play','f');$('mp').innerHTML=ic(p?'pause':'play','f');$('fcov').classList.toggle('pl',p)}
au.onplay=au.onpause=pstate;
au.onended=function(){if(S.sleepEnd){S.sleepEnd=false;S.sleep=0;updSleep();toast('Таймер сна: музыка остановлена');return}if(S.rep===2){au.currentTime=0;au.play()}else step(1)};
au.ontimeupdate=function(){var d=au.duration;if(d){$('sk').value=au.currentTime/d*1000;$('mpb').style.width=au.currentTime/d*100+'%'}$('ct').textContent=fmt(au.currentTime);$('dt').textContent=fmt(d)};
$('sk').oninput=function(){if(au.duration)au.currentTime=this.value/1000*au.duration};
$('fdown').innerHTML=ic('down');$('bspd').textContent='1×';$('bslp').innerHTML=ic('moon');$('bq').innerHTML=ic('list');$('bs').innerHTML=ic('shuf');$('bpv').innerHTML=ic('prev','f');$('bnx').innerHTML=ic('next','f');$('mini').lastElementChild.previousElementSibling.nextElementSibling;
document.querySelectorAll('#mini .ib')[1].innerHTML=ic('next','f');
function fit(){var r=document.documentElement,sa=navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);var sh=sa&&innerHeight>=innerWidth&&innerHeight<Math.max(screen.height,screen.width)-8;if(sh)r.style.setProperty('--sab','0px');else r.style.removeProperty('--sab')}
fit();addEventListener('resize',fit);addEventListener('orientationchange',function(){setTimeout(fit,250)});
loadTheme();loadMeta();openDB().then(function(){S.tracks.forEach(function(t){delete t.blob});syncBtns();pstate();updFav();render()});
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script></body></html>
